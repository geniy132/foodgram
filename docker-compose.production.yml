volumes:
  pg_data_production:
  static_volume:
  media_volume:

services:
  db:
    image: postgres:13
    container_name: db
    env_file: .env
    volumes:
      - pg_data_production:/var/lib/postgresql/data
  backend:
    depends_on:
      db:
        condition: service_started
    image: geniy132/foodgram_backend
    container_name: backend
    env_file: .env
    volumes:
      - static_volume:/backend_static
      - media_volume:/app/media/
  frontend:
    image: geniy132/foodgram_frontend
    container_name: frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static_volume:/frontend_static
  gateway:
    depends_on:
      backend:
        condition: service_started
    image: geniy132/foodgram_gateway
    container_name: gateway
    env_file: .env
    volumes:
      - static_volume:/static/
      - media_volume:/app/media/
    ports:
      - 8000:80
