volumes:
  pg_data:
  static:
  media:

services:
  db:
    image: postgres:13
    container_name: db
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data
  backend:
    depends_on:
      db:
        condition: service_started
    build:  ./backend/
    container_name: backend
    env_file: .env
    volumes:
      - static:/backend_static
      - media:/app/media/
  frontend:
    build:  ./frontend/
    container_name: frontend
    env_file: .env
    command: cp -r /app/build/. /frontend_static/
    volumes:
      - static:/frontend_static
  gateway:
    depends_on:
      backend:
        condition: service_started
    build:  ./nginx/
    container_name: gateway
    env_file: .env
    volumes:
      - static:/static/
      - media:/app/media/
    ports:
      - 8000:80
